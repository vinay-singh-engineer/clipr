version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: clipr
      POSTGRES_PASSWORD: clipr
      POSTGRES_DB: clipr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipr"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://clipr:clipr@db:5432/clipr
      BASE_URL: http://localhost:8000
      REDIS_URL: redis://redis:6379
    env_file:
      - .env

volumes:
  postgres_data:
